name: CI

# CI validates every Pull Request into main.
# It never publishes an artifact -- only the release workflow does that.
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "development", "feature/**" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Run tests
        run: |
          pytest -v

  docker-build-check:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (validation only, no push)
        run: |
          docker build -t student-ml-api:ci-check .
